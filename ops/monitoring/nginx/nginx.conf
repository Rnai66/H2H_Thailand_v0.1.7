worker_processes  1;

events {
  worker_connections 1024;
}

http {
  sendfile on;

  server {
    listen 8080;
    server_name _;

    # ✅ Allow subnet: macOS bridge + docker internal + host
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.65.0/24;   # Docker Desktop bridge (macOS)
    allow 172.16.0.0/12;     # Docker container subnet
    allow 149.154.0.0/16;    # Prometheus IP from logs
    deny all;

    # Simple liveness endpoint
    location = /healthz {
      return 200;
    }

    # =============================
    # ✅ Prometheus metrics gateway
    # =============================
    location = /h2h_metrics {
      # Basic Auth (match Prometheus config)
      auth_basic "H2H Metrics Restricted";
      auth_basic_user_file /etc/nginx/.htpasswd;

      # Headers to backend
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Metrics-Token "change-me-strong"; # same as METRICS_TOKEN in backend

      # backend running on host:4000
      proxy_pass http://host.docker.internal:4000/api/metrics;

      # Security headers
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      add_header Referrer-Policy no-referrer;
    }

    # Optional direct health check
    location /api/health/ {
      proxy_pass http://host.docker.internal:4000;
    }
  }
}
